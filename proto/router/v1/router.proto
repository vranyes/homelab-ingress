syntax = "proto3";
package router.v1;
option go_package = "github.com/vranyes/homelab-ingress/ingress/pkg/api/router/v1;routerv1";

service RouterService {
  rpc CreateLoadBalancer(CreateLoadBalancerRequest) returns (CreateLoadBalancerResponse);
  rpc UpdateLoadBalancer(UpdateLoadBalancerRequest) returns (UpdateLoadBalancerResponse);
  rpc DeleteLoadBalancer(DeleteLoadBalancerRequest) returns (DeleteLoadBalancerResponse);
  rpc GetLoadBalancer(GetLoadBalancerRequest) returns (GetLoadBalancerResponse);
  rpc ListLoadBalancers(ListLoadBalancersRequest) returns (ListLoadBalancersResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message PortMapping {
  string protocol = 1;
  uint32 src_port = 2;
  repeated Destination dst = 3;
}

message Destination {
  uint32 port = 1;
  string addr = 2;
}

// RateLimit caps the number of new connections per source IP for a
// LoadBalancer Service. Rate is the sustained number of new connections per
// second; burst is the token-bucket capacity. A burst of zero means "use the
// rate".
message RateLimit {
  uint64 rate = 1;
  uint32 burst = 2;
}

message CreateLoadBalancerRequest {
  string service_key = 1;
  repeated PortMapping ports = 2;
  repeated string allowed_geos = 3; // ISO-3166 alpha-2 country codes
  RateLimit rate_limit = 4;          // absent disables rate limiting
  repeated string allowed_cidrs = 5; // IPv4 CIDRs always allowed (e.g. LAN ranges)
}

message CreateLoadBalancerResponse {
  string assigned_ip = 1;
}

message UpdateLoadBalancerRequest {
  string service_key = 1;
  repeated PortMapping ports = 2;
  repeated string allowed_geos = 3; // ISO-3166 alpha-2 country codes
  RateLimit rate_limit = 4;          // absent clears the rate limit
  repeated string allowed_cidrs = 5; // IPv4 CIDRs always allowed (e.g. LAN ranges)
}

message UpdateLoadBalancerResponse {}

message DeleteLoadBalancerRequest {
  string service_key = 1;
}

message DeleteLoadBalancerResponse {}

message GetLoadBalancerRequest {
  string service_key = 1;
}

message GetLoadBalancerResponse {
  string service_key = 1;
  string assigned_ip = 2;
  repeated PortMapping ports = 3;
  bool dhcp_acquired = 4;
  string interface_name = 5;
  repeated string allowed_geos = 6; // ISO-3166 alpha-2 country codes
  RateLimit rate_limit = 7;          // absent means rate limiting is disabled
  repeated string allowed_cidrs = 8; // IPv4 CIDRs always allowed (e.g. LAN ranges)
}

message ListLoadBalancersRequest {}

message ListLoadBalancersResponse {
  repeated GetLoadBalancerResponse load_balancers = 1;
}

message HealthRequest {}

message HealthResponse {
  bool healthy = 1;
  string base_interface = 2;
  int32 active_macvlans = 3;
}
