---
archives:
- files:
  - none*
  formats: [binary]
builds:
- binary: controller
  env:
  - CGO_ENABLED=0
  flags:
  - "-trimpath"
  goarch:
  - arm64
  - amd64
  goos:
  - linux
  id: controller
  ldflags:
  - "-s -w"
  main: ./controller/cmd/controller
- binary: ingress
  env:
  - CGO_ENABLED=0
  flags:
  - "-trimpath"
  goarch:
  - arm64
  - amd64
  goos:
  - linux
  id: ingress
  ldflags:
  - "-s -w"
  main: ./ingress/cmd/ingress
- binary: hictl
  env:
  - CGO_ENABLED=0
  flags:
  - "-trimpath"
  goarch:
  - arm64
  - amd64
  goos:
  - darwin
  - linux
  id: hictl
  ldflags:
  - "-s -w"
  main: ./ingress/cmd/hictl
kos:
- build: controller
  id: controller
  platforms:
  - linux/amd64
  - linux/arm64
  repositories:
  - ghcr.io/vranyes/homelab-ingress/controller
  tags:
  - '{{.Commit}}'
  - '{{.Tag}}'
  # ko defaults to publishing an SPDX SBOM as an OCI referrer. GHCR denies
  # the referrer write for the manifest list with the workflow GITHUB_TOKEN
  # ("DENIED: requested access to the resource is denied"), failing the whole
  # release after the image has already been published. SBOMs are optional
  # for this project, so skip them and keep releases deterministic.
  sbom: none
project_name: homelab-ingress
version: 2
