global:
  scrape_interval: 15s

rule_files:
  - "rules.yaml"

scrape_configs:
  - job_name: "homelab-ingress-daemon"
    static_configs:
      - targets: ["router:9102"]
        labels:
          component: "daemon"

  - job_name: "homelab-ingress-controller"
    static_configs:
      - targets: ["controller:8080"]
        labels:
          component: "controller"
