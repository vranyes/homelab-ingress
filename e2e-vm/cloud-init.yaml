#cloud-config
#
# NoCloud-style user-data for the homelab-ingress e2e VM.
#
# This file is NOT consumed by lima (lima uses `provision:` in lima.yaml). It
# is kept next to lima.yaml as a convenience for testing the same bootstrap
# against real cloud-init on a plain Alpine cloud image, e.g.:
#
#   cloud-localds seed.img cloud-init.yaml
#   qemu-system-x86_64 ... -drive file=seed.img ...
#
# The authoritative provisioning logic lives in e2e-vm/lima.yaml's
# `provision:` script. Keep these two files in sync when you change the
# bootstrap.
---
packages:
- nftables
- iproute2
- dnsmasq
- iptables
- openrc
- curl
- tar
- bash
- sudo
- parted
- util-linux

package_update: true

write_files:
- path: /etc/dnsmasq.d/hl-ingress.conf
  content: |
    interface=br0
    bind-interfaces
    dhcp-range=10.44.0.10,10.44.0.100,255.255.255.0,24h

- path: /etc/init.d/hl-ingress-oidc
  permissions: '0755'
  content: |
    #!/sbin/openrc-run
    description="homelab-ingress oidc-mock"
    command="/usr/local/bin/oidc-mock"
    pidfile="/run/hl-ingress-oidc.pid"
    output_log="/var/log/hl-ingress/oidc.log"
    error_log="/var/log/hl-ingress/oidc.log"
    command_background=true
    command_user="root"

    depend() {
        need net
    }

    start_pre() {
        mkdir -p /var/run/hl-ingress /var/log/hl-ingress
    }

- path: /etc/init.d/hl-ingress-ingress
  permissions: '0755'
  content: |
    #!/sbin/openrc-run
    description="homelab-ingress ingress daemon"
    command="/usr/local/bin/ingress"
    command_args="--config /etc/homelab-ingress/config.yaml --state-dir /var/lib/homelab-ingress"
    pidfile="/run/hl-ingress-ingress.pid"
    output_log="/var/log/hl-ingress/ingress.log"
    error_log="/var/log/hl-ingress/ingress.log"
    command_background=true
    command_user="root"

    depend() {
        need net
        after dnsmasq
    }

    start_pre() {
        mkdir -p /var/run/hl-ingress /var/log/hl-ingress /var/lib/homelab-ingress
    }

- path: /usr/local/bin/hl-ingress-controller-wrapper.sh
  permissions: '0755'
  content: |
    #!/bin/sh
    export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    exec /usr/local/bin/controller \
        --router-addr 127.0.0.1:50051 \
        --token-path /var/run/hl-ingress/token \
        --ca-path /var/lib/homelab-ingress/ca.pem \
        --metrics-addr :8081 \
        --poll-interval 5s \
        "$@"

- path: /etc/init.d/hl-ingress-controller
  permissions: '0755'
  content: |
    #!/sbin/openrc-run
    description="homelab-ingress kubernetes controller"
    command="/usr/local/bin/hl-ingress-controller-wrapper.sh"
    pidfile="/run/hl-ingress-controller.pid"
    output_log="/var/log/hl-ingress/controller.log"
    error_log="/var/log/hl-ingress/controller.log"
    command_background=true
    command_user="root"

    depend() {
        need net
        after k3s
    }

    start_pre() {
        mkdir -p /var/run/hl-ingress /var/log/hl-ingress
    }

- path: /etc/profile.d/golang.sh
  owner: root:root
  permissions: '0755'
  content: |
    export PATH=$PATH:/usr/local/go/bin
    export GOPATH=$HOME/go
    export PATH=$PATH:$GOPATH/bin

runcmd:
# Install Go 1.26.5 (for controller build).
- curl -fsSL https://go.dev/dl/go1.26.5.linux-amd64.tar.gz -o /tmp/go.tar.gz
- rm -rf /usr/local/go
- tar -C /usr/local -xzf /tmp/go.tar.gz
- rm /tmp/go.tar.gz
- |-
  cat << 'EOF' >> /etc/bash.bashrc

  # Go environment setup
  export PATH=$PATH:/usr/local/go/bin
  export GOPATH=$HOME/go
  export PATH=$PATH:$GOPATH/bin
  EOF

# k3s (embedded containerd; flannel on lima0; no traefik/servicelb).
- |
  if ! command -v k3s >/dev/null 2>&1; then
      curl -sfL https://get.k3s.io | sh -s - \
          --disable=traefik \
          --disable=servicelb \
          --flannel-iface=lima0
  fi

# br0 host-only bridge (10.44.0.1/24). Idempotent.
- |
  if ! ip link show br0 >/dev/null 2>&1; then
      ip link add name br0 type bridge
  fi
  ip addr flush dev br0 || true
  ip addr add 10.44.0.1/24 dev br0
  ip link set br0 up

# dnsmasq on br0.
- rc-update add dnsmasq default
- rc-service dnsmasq restart

# State and runtime directories.
- |
  mkdir -p \
      /etc/homelab-ingress \
      /var/lib/homelab-ingress \
      /var/run/hl-ingress \
      /var/log/hl-ingress

# Enable OpenRC services. We do NOT start them; the test harness starts
# them after writing the config file and the bearer token.
- rc-update add hl-ingress-oidc default
- rc-update add hl-ingress-ingress default
- rc-update add hl-ingress-controller default

- echo "hl-ingress cloud-init complete"

final_message: "hl-ingress cloud-init complete after $UPTIME seconds"
