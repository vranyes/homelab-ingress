---
auth:
  allowed_subjects:
  # The service account the controller runs as — matches Kubernetes projected service account tokens.
  - system:serviceaccount:homelab-ingress:homelab-ingress-controller
  # Additional subjects can be added, e.g. for the CLI:
  # - some-other-subject
  # audience and issuer are required.
  audience: homelab-ingress
  issuer: https://myoidcissuer.local:6443
  # trusted_root_ca is optional. When set, it points to a CA certificate file
  # used to verify the TLS connection to the OIDC issuer. Useful for private
  # OIDC providers with self-signed certificates.
  # trusted_root_ca: /etc/homelab-ingress/oidc-ca.pem
base_interface: wan
grpc:
  listen: 0.0.0.0:50051
ws:
  listen: 0.0.0.0:50052

# Masquerade rules for same-L2 traffic between VLANs.
# Each entry generates: iifname "input" oifname "output" ct status dnat masquerade
# masquerade:
#   - input_device: br-lan.10
#     output_device: br-lan.20
#   - input_device: br-lan.30
#     output_device: br-lan.40

# Geo-blocking (optional). With a provider set, the daemon downloads and
# refreshes a country database, then enforces each LoadBalancer Service's
# homelab-ingress.vranyes.com/allowed-geos annotation (e.g. "US,CA").
# Providers: "dbip" (free, no key; data by DB-IP, https://db-ip.com, CC BY 4.0),
# "maxmind" (GeoLite2; requires a license key), or "mock" (e2e fixture).
# Without this block, Services must not set allowed-geos (the static
# homelab-ingress.vranyes.com/allowed-cidrs allow-list works without it).
# geoip:
#   provider: dbip
#   refresh_interval: 24h
#   stale_after: 840h
#   # Defaults to <state-dir>/dbip-country-lite.mmdb.
#   # cache_path: /var/lib/homelab-ingress/dbip-country-lite.mmdb
#
# For MaxMind instead:
# geoip:
#   provider: maxmind
#   license_key: YOUR_MAXMIND_LICENSE_KEY
#   edition: GeoLite2-Country
#   stale_after: 168h
