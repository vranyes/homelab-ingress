---
jobs:
  build:
    name: Build controller image
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v5
      with:
        go-version: "1.26"
    - uses: goreleaser/goreleaser-action@v6
      with:
        args: build --snapshot
        distribution: goreleaser
        version: ~> v2
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v5
      with:
        go-version: "1.26"
    - name: Run tests
      run: go test ./internal/... -cover -v
      working-directory: ${{ matrix.module }}
    strategy:
      matrix:
        module: [ingress, controller]
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
