name: e2e

on:
  pull_request:
    paths:
      - 'ingress/**'
      - 'controller/**'
      - 'proto/**'
      - 'e2e/**'
      - 'e2e-vm/**'
      - 'files/**'
      - 'nfpm/**'
      - 'controller/deploy/**'
      - 'Makefile'
      - '.github/workflows/e2e.yaml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Vet e2e module (fast fail on compile errors)
        run: |
          cd e2e && GOOS=linux go vet -tags=e2e ./...
      - name: Install lima
        run: |
          # Lima >= 2.0 is required: e2e-vm/lima.yaml uses `provision: mode: data`.
          curl -fsSL https://github.com/lima-vm/lima/releases/download/v2.2.1/lima-2.2.1-Linux-x86_64.tar.gz \
            | sudo tar xz -C /usr/local --strip-components=1
          limactl --version
      - name: Install QEMU (Lima's VM driver on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf
          qemu-img --version | head -1
          qemu-system-x86_64 --version | head -1
      - name: Enable nested KVM (faster lima boot)
        run: |
          sudo chmod 666 /dev/kvm || true
          ls -la /dev/kvm || true
      - name: Cache lima VM image
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/lima
          key: lima-hl-ingress-${{ hashFiles('e2e-vm/**') }}
      - name: Run ingress unit tests in VM (linux-only packages)
        run: make test-unit-vm
      - name: Run e2e suite
        run: make test-e2e
      - name: Collect logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hl-ingress-vm-logs
          path: ~/.cache/lima/*/log/*.log
          if-no-files-found: ignore
