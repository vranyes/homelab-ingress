---
jobs:
  release:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v5
      with:
        go-version: "1.26"
    - uses: docker/login-action@v3
      with:
        password: ${{ secrets.GITHUB_TOKEN }}
        registry: ghcr.io
        username: ${{ github.actor }}
    - env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        args: release --clean
        distribution: goreleaser
        version: ~> v2
    - id: version
      name: Derive version
      run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
    - name: Install nfpm
      run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
    - env:
        VERSION: ${{ steps.version.outputs.version }}
      name: Build APK package - aarch64_cortex-a53
      run: nfpm package -f nfpm/a53.yaml -p apk -t dist/
    - env:
        VERSION: ${{ steps.version.outputs.version }}
      name: Build APK package - aarch64_cortex-a72
      run: nfpm package -f nfpm/a72.yaml -p apk -t dist/
    - env:
        VERSION: ${{ steps.version.outputs.version }}
      name: Build APK package - x86_64
      run: nfpm package -f nfpm/x86_64.yaml -p apk -t dist/
    - env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      name: Upload APK packages to release
      run: gh release upload ${{ github.ref_name }} dist/*.apk --clobber
name: Release
on:
  push:
    tags:
    - v*
