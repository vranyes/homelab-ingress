---
apk:
  arch: x86_64
arch: amd64
contents:
- dst: /usr/bin/homelab-ingress
  file_info:
    mode: 755
  src: dist/ingress_linux_amd64_v1/ingress
- dst: /etc/init.d/homelab-ingress
  file_info:
    mode: 700
  src: files/homelab-ingress.init
- dst: /etc/config/homelab-ingress
  file_info:
    mode: 644
  src: files/homelab-ingress.config
- dst: /etc/homelab-ingress/config.yaml.example
  file_info:
    mode: 644
  src: files/config.yaml
depends:
- procd
- uci
description: Homelab ingress controller for OpenWrt devices.
license: GPL-3.0
maintainer: Josiah Vranyes
name: homelab-ingress
platform: linux
version: ${VERSION}
